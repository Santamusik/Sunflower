<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>달의 모양 변화 학습 프로그램</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="intro-container">
            <h1>🌙 달의 모양 변화 시뮬레이터</h1>
            <p class="subtitle">달이 어떻게 변하는지 함께 알아볼까요?</p>

            <div class="info-form">
                <h2>학생 정보를 입력해주세요</h2>
                <form id="studentForm">
                    <div class="form-group">
                        <label for="school">학교</label>
                        <input type="text" id="school" name="school" required placeholder="예: 해님초등학교">
                    </div>

                    <div class="form-group">
                        <label for="grade">학년</label>
                        <select id="grade" name="grade" required>
                            <option value="">선택하세요</option>
                            <option value="1">1학년</option>
                            <option value="2">2학년</option>
                            <option value="3">3학년</option>
                            <option value="4" selected>4학년</option>
                            <option value="5">5학년</option>
                            <option value="6">6학년</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="class">반</label>
                        <input type="number" id="class" name="class" required min="1" max="20" placeholder="예: 3">
                    </div>

                    <div class="form-group">
                        <label for="name">이름</label>
                        <input type="text" id="name" name="name" required placeholder="예: 김하늘">
                    </div>

                    <button type="submit" class="btn-primary">시작하기</button>
                </form>
            </div>

            <div class="teacher-link">
                <a href="teacher.html">선생님이신가요? 여기를 클릭하세요</a>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
