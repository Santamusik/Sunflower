<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>달 퀴즈</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="quiz-container">
            <h1>🌙 달 퀴즈</h1>
            <p class="subtitle">달의 모양 변화에 대해 얼마나 이해했는지 확인해봐요!</p>

            <div class="quiz-progress">
                <span id="questionNumber">문제 1 / 3</span>
            </div>

            <div class="question-card">
                <div class="question-text" id="questionText">
                    질문이 여기에 표시됩니다.
                </div>

                <ul class="options" id="optionsList">
                    <!-- Options will be added here dynamically -->
                </ul>
            </div>

            <div id="feedbackContainer" class="feedback" style="display: none;"></div>

            <div class="quiz-buttons">
                <button id="submitAnswer" class="btn-submit">정답 확인</button>
                <button id="nextQuestion" class="btn-next" style="display: none;">다음 문제</button>
                <button id="retryQuestion" class="btn-retry" style="display: none;">다시 풀기</button>
            </div>

            <!-- Results section (hidden initially) -->
            <div id="resultsSection" style="display: none;">
                <div class="results-container">
                    <h2>🎉 퀴즈 완료!</h2>
                    <div class="score-display">
                        <span id="finalScore">3 / 3</span>
                    </div>
                    <div class="results-message" id="resultsMessage">
                        <!-- Message will be added dynamically -->
                    </div>
                    <button class="btn-primary" onclick="window.location.href='simulator.html'">시뮬레이터로 돌아가기</button>
                    <button class="btn-secondary" style="margin-top: 10px;" onclick="window.location.href='index.html'">처음으로</button>
                </div>
            </div>
        </div>
    </div>

    <script src="data/questions.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
